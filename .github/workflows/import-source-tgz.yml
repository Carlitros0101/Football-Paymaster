name: Import Football Paymaster source TGZ

on:
  push:
    branches: [main]
    paths:
      - "football-paymaster-source.tgz"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive
        run: |
          tar -xzf football-paymaster-source.tgz
          rm football-paymaster-source.tgz
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand imported Football Paymaster source"
          git push
