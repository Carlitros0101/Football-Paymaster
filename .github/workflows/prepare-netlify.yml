name: Prepare Football Paymaster for Netlify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-netlify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror live Replit deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/public
          mkdir -p dist/public
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          BASE = "https://football-paymaster--carlosandrespar.replit.app/"
          OUT = Path("dist/public")

          def fetch(url):
              req = Request(url, headers={"User-Agent": "Mozilla/5.0 GitHub-Actions-Netlify-Migration"})
              with urlopen(req, timeout=60) as r:
                  return r.read()

          html = fetch(BASE)
          (OUT / "index.html").write_bytes(html)

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("src", "href"):
                      value = attrs.get(key)
                      if value:
                          self.urls.add(value)

          parser = Parser()
          parser.feed(html.decode("utf-8", errors="ignore"))
          host = urlparse(BASE).netloc

          for raw in sorted(parser.urls):
              if raw.startswith(("data:", "mailto:", "javascript:", "#")):
                  continue
              url = urljoin(BASE, raw)
              parsed = urlparse(url)
              if parsed.netloc != host or not parsed.path or parsed.path == "/":
                  continue
              target = OUT / parsed.path.lstrip("/")
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  target.write_bytes(fetch(url))
                  print("Downloaded", parsed.path)
              except Exception as exc:
                  print("Warning:", url, exc)

          if not list(OUT.rglob("*.js")):
              raise SystemExit("No JavaScript bundle found; mirror is incomplete")
          PY

          printf '/*    /index.html   200\n' > dist/public/_redirects

      - name: Configure Netlify static deployment
        shell: bash
        run: |
          cat > netlify.toml <<'EOF'
          [build]
            command = "echo 'Using prebuilt Football Paymaster static bundle'"
            publish = "dist/public"

          [[redirects]]
            from = "/*"
            to = "/index.html"
            status = 200
          EOF

      - name: Remove temporary migration fragments
        shell: bash
        run: |
          rm -rf .source
          rm -f football-paymaster-source.tgz
          rm -f client/public/favicon.png.base64

      - name: Verify static deployment
        shell: bash
        run: |
          test -s dist/public/index.html
          find dist/public -type f -name '*.js' -size +1c | grep -q .
          echo "Football Paymaster static build ready for Netlify"

      - name: Commit prepared site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Prepare Football Paymaster static build for Netlify"
          git push
