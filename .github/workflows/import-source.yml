name: Expand Football Paymaster source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and expand source
        shell: bash
        run: |
          cat .source/chunk-* | base64 --decode > /tmp/football-paymaster.tgz
          tar -xzf /tmp/football-paymaster.tgz
          rm -rf .source
          rm -f football-paymaster-source.tgz
          rm -f client/public/favicon.png.base64
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import complete Football Paymaster source"
          git push
